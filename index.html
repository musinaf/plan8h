<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Plan 8h</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --txt:#1c1e21; --mut:#6b7280; --pri:#1f6feb; --ok:#1a9d55; --warn:#e08a00; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --txt:#eceef1; --mut:#9aa3af; --line:#2b3039; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif; background:var(--bg); color:var(--txt);
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width:560px; margin:0 auto; padding:12px; }
  h1 { font-size:20px; margin:8px 4px 12px; display:flex; justify-content:space-between; align-items:center; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .daybar { display:flex; gap:8px; align-items:center; }
  .daybar input[type=date] { flex:1; }
  input, button, select { font:inherit; color:inherit; }
  input[type=text], input[type=number], input[type=date] {
    width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  button { border:0; border-radius:10px; padding:10px 14px; background:var(--pri); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--mut); padding:6px 10px; }
  button.sec { background:var(--bg); color:var(--txt); border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; }
  .meter { margin:10px 0 2px; }
  .meter .lbl { display:flex; justify-content:space-between; font-size:14px; color:var(--mut); margin-bottom:4px; }
  .bar { height:10px; border-radius:6px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--pri); width:0; transition:width .3s; }
  .bar.full > i { background:var(--warn); }
  .task { display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .task:first-child { border-top:0; }
  .task .t { flex:1; min-width:0; }
  .task .t b { display:block; overflow-wrap:anywhere; }
  .task .t small { color:var(--mut); }
  .task.done .t b { text-decoration:line-through; color:var(--mut); }
  .task input[type=checkbox] { width:22px; height:22px; }
  .play { width:40px; height:40px; border-radius:50%; padding:0; font-size:16px; }
  .play.on { background:var(--warn); }
  .empty { color:var(--mut); text-align:center; padding:12px; }
  .msg { font-size:13px; color:var(--mut); margin-top:6px; }
  details summary { cursor:pointer; color:var(--mut); }
  label.small { font-size:14px; color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>Plan zilnic <button class="ghost" id="notifBtn">🔔 Activează notificări</button></h1>

  <div class="card">
    <div class="daybar">
      <button class="sec" id="prev">‹</button>
      <input type="date" id="day">
      <button class="sec" id="next">›</button>
    </div>
    <div class="meter">
      <div class="lbl"><span>Planificat (estimat)</span><span id="plannedTxt"></span></div>
      <div class="bar" id="plannedBar"><i></i></div>
    </div>
    <div class="meter">
      <div class="lbl"><span>Lucrat (cronometru)</span><span id="workedTxt"></span></div>
      <div class="bar" id="workedBar"><i></i></div>
    </div>
  </div>

  <div class="card">
    <form id="form">
      <input type="text" id="title" placeholder="Task nou…" required autocomplete="off">
      <div class="row" style="margin-top:8px">
        <input type="number" id="h" min="0" max="24" placeholder="ore" inputmode="numeric" value="0">
        <span>h</span>
        <input type="number" id="m" min="0" max="59" step="5" placeholder="min" inputmode="numeric" value="30">
        <span>min</span>
        <button type="submit">Adaugă</button>
      </div>
    </form>
  </div>

  <div class="card" id="list"></div>

  <div class="card">
    <details>
      <summary>Setări</summary>
      <div class="row" style="margin-top:10px">
        <label class="small" for="limit">Prag notificare (ore):</label>
        <input type="number" id="limit" min="1" max="24" step="0.5" style="width:90px">
      </div>
      <p class="msg">Notificarea pentru timp lucrat funcționează cel mai sigur cât timp cronometrul rulează și aplicația este deschisă sau recent în fundal. La redeschidere, aplicația verifică din nou pragurile.</p>
    </details>
  </div>
</main>

<script>
(() => {
  'use strict';
  const KEY = 'plan8h.v1';
  const $ = id => document.getElementById(id);

  // ---- state ----
  let state = load();
  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.tasks) return s; } catch (e) {}
    return { tasks: [], limitHours: 8, notified: {} }; // notified[date] = {planned:true, worked:true}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  let curDay = ymd(new Date());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // ---- time helpers ----
  const fmtMin = m => { m = Math.round(m); const h = Math.floor(m/60), r = m%60; return h ? `${h}h ${pad(r)}m` : `${r}m`; };
  const workedSec = t => (t.workedSec || 0) + (t.startedAt ? (Date.now() - t.startedAt)/1000 : 0);
  const limitMin = () => state.limitHours * 60;
  const dayTasks = d => state.tasks.filter(t => t.date === d);
  const plannedMin = d => dayTasks(d).reduce((s, t) => s + t.estMin, 0);
  const workedMin = d => dayTasks(d).reduce((s, t) => s + workedSec(t)/60, 0);

  // ---- notifications ----
  async function notify(title, body, tag) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) { await reg.showNotification(title, { body, tag, icon: 'icon-192.png', badge: 'icon-192.png', vibrate: [200,100,200] }); return; }
    } catch (e) {}
    try { new Notification(title, { body, tag, icon: 'icon-192.png' }); } catch (e) {}
  }
  function updateNotifBtn() {
    const b = $('notifBtn');
    if (!('Notification' in window)) { b.textContent = 'Notificări indisponibile'; b.disabled = true; return; }
    b.style.display = Notification.permission === 'granted' ? 'none' : '';
    b.textContent = Notification.permission === 'denied' ? '🔕 Blocate în setări' : '🔔 Activează notificări';
  }
  $('notifBtn').onclick = async () => {
    if (!('Notification' in window)) return;
    await Notification.requestPermission();
    updateNotifBtn();
  };

  // Verifică pragurile pentru ZIUA DE AZI (notificăm o singură dată pe zi, pe fiecare tip).
  function checkThresholds() {
    const today = ymd(new Date());
    const n = state.notified[today] || (state.notified[today] = {});
    const lim = limitMin(), lh = state.limitHours;
    if (!n.planned && plannedMin(today) >= lim) {
      n.planned = true; save();
      notify('Ai planificat ' + lh + 'h pentru azi', 'Timpul estimat al task-urilor a atins ' + fmtMin(plannedMin(today)) + '. Nu mai adăuga altele.', 'planned-' + today);
    }
    if (!n.worked && workedMin(today) >= lim) {
      n.worked = true; save();
      notify('Ai lucrat ' + lh + ' ore azi', 'Timpul lucrat a atins ' + fmtMin(workedMin(today)) + '. Ia o pauză.', 'worked-' + today);
    }
  }

  // ---- render ----
  function renderMeters() {
    const lim = limitMin();
    const p = plannedMin(curDay), w = workedMin(curDay);
    $('plannedTxt').textContent = `${fmtMin(p)} / ${state.limitHours}h`;
    $('workedTxt').textContent = `${fmtMin(w)} / ${state.limitHours}h`;
    for (const [id, v] of [['plannedBar', p], ['workedBar', w]]) {
      const el = $(id), pct = Math.min(100, v / lim * 100);
      el.firstElementChild.style.width = pct + '%';
      el.classList.toggle('full', v >= lim);
    }
  }
  function render() {
    $('day').value = curDay;
    $('limit').value = state.limitHours;
    const list = $('list');
    const ts = dayTasks(curDay);
    list.innerHTML = '';
    if (!ts.length) { list.innerHTML = '<div class="empty">Niciun task pentru această zi.</div>'; }
    for (const t of ts) {
      const el = document.createElement('div');
      el.className = 'task' + (t.done ? ' done' : '');
      el.dataset.id = t.id;
      const running = !!t.startedAt;
      el.innerHTML = `
        <input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Gata">
        <div class="t"><b></b><small>estimat ${fmtMin(t.estMin)} · lucrat <span class="w">${fmtMin(workedSec(t)/60)}</span></small></div>
        <button class="play ${running ? 'on' : ''}" aria-label="${running ? 'Pauză' : 'Start'}">${running ? '⏸' : '▶'}</button>
        <button class="ghost del" aria-label="Șterge">✕</button>`;
      el.querySelector('b').textContent = t.title;
      list.appendChild(el);
    }
    renderMeters();
  }
  function tickLabels() {
    for (const el of document.querySelectorAll('.task')) {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (t) el.querySelector('.w').textContent = fmtMin(workedSec(t)/60);
    }
    renderMeters();
  }

  // ---- actions ----
  $('form').onsubmit = e => {
    e.preventDefault();
    const title = $('title').value.trim();
    const est = (parseInt($('h').value) || 0) * 60 + (parseInt($('m').value) || 0);
    if (!title) return;
    state.tasks.push({ id: uid(), title, estMin: est, date: curDay, done: false, workedSec: 0, startedAt: null });
    $('title').value = '';
    save(); render(); checkThresholds();
  };
  $('list').onclick = e => {
    const row = e.target.closest('.task'); if (!row) return;
    const t = state.tasks.find(x => x.id === row.dataset.id); if (!t) return;
    if (e.target.closest('.del')) {
      if (!confirm('Ștergi task-ul?')) return;
      state.tasks = state.tasks.filter(x => x !== t);
    } else if (e.target.closest('.play')) {
      if (t.startedAt) { t.workedSec = workedSec(t); t.startedAt = null; }
      else {
        // un singur cronometru activ o dată
        for (const o of state.tasks) if (o.startedAt) { o.workedSec = workedSec(o); o.startedAt = null; }
        t.startedAt = Date.now();
      }
    } else if (e.target.type === 'checkbox') {
      t.done = e.target.checked;
      if (t.done && t.startedAt) { t.workedSec = workedSec(t); t.startedAt = null; }
    } else return;
    save(); render(); checkThresholds();
  };
  const shift = n => { const d = new Date(curDay + 'T12:00:00'); d.setDate(d.getDate() + n); curDay = ymd(d); render(); };
  $('prev').onclick = () => shift(-1);
  $('next').onclick = () => shift(1);
  $('day').onchange = e => { if (e.target.value) { curDay = e.target.value; render(); } };
  $('limit').onchange = e => {
    const v = parseFloat(e.target.value);
    if (v > 0) { state.limitHours = v; state.notified = {}; save(); render(); checkThresholds(); }
  };

  // ---- loop ----
  setInterval(() => { tickLabels(); checkThresholds(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickLabels(); checkThresholds(); } });

  // ---- init ----
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  updateNotifBtn();
  render();
  checkThresholds();
})();
</script>
</body>
</html>
